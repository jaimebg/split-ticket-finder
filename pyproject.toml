[project]
name = "split-ticket-finder"
version = "1.0.0"
description = "Telegram bot that finds split-ticket itineraries cheaper than the airline through-fare by routing through a discounted hub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaime Barreto" }]
keywords = ["telegram-bot", "flights", "asyncio", "scraping", "split-ticketing"]

dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

# setuptools cannot guess what to package in a flat layout with more than one
# top-level package -- it refuses rather than risk shipping the wrong thing, so
# `pip install -e .` fails outright without this. `find` (rather than an
# explicit list) means a new subpackage under any of these -- handlers/search/
# was the last one -- is picked up without editing this file again.
[tool.setuptools.packages.find]
include = ["engine*", "handlers*", "providers*"]

# The flat modules beside those packages. Tests import db, config, models and
# search directly, and bot is the entry point.
[tool.setuptools]
py-modules = ["bot", "config", "db", "models", "scheduler", "search"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: hits the live Kiwi API; deselected by default, run with -m network",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults (used for config defaults)
    "RUF001", # en dashes and box-drawing characters are used deliberately
    "RUF002", # ...in docstrings
    "RUF003", # ...and in section-header comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path juggling before imports
